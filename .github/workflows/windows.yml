name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\scripts\Build.ps1
      - name: Policy and package checks
        shell: powershell
        run: .\tests\Test.ps1
      - name: Package
        shell: powershell
        run: .\scripts\Package.ps1
      - name: Installer safety checks
        shell: powershell
        run: .\tests\InstallerSafety.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeKeeper-windows-beta
          path: |
            dist/*.zip
            dist/*.sha256
